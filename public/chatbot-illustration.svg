<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none">
    <!-- Background elements -->
    <g>
        <!-- Plant pot -->
        <rect x="70" y="250" width="40" height="45" rx="5" fill="#8B7355" />
        <ellipse cx="90" cy="250" rx="25" ry="8" fill="#A0826D" />
        <!-- Plant leaves -->
        <path d="M85 250 Q75 220 65 200 Q80 210 90 200 Q100 210 105 200 Q95 220 85 250" fill="#4CAF50" />
        <path d="M90 250 Q80 230 70 215 Q85 220 95 210 Q105 220 110 210 Q100 230 90 250" fill="#66BB6A" />
    </g>

    <!-- Chat bubbles background -->
    <g>
        <rect x="130" y="60" width="180" height="50" rx="10" fill="#FFC107" />
        <rect x="130" y="120" width="150" height="40" rx="10" fill="#FFC107" />
        <rect x="130" y="170" width="170" height="45" rx="10" fill="#FFC107" />
        <!-- Lines inside bubbles -->
        <rect x="145" y="75" width="120" height="8" rx="4" fill="#FFE082" />
        <rect x="145" y="88" width="80" height="8" rx="4" fill="#FFE082" />
        <rect x="145" y="135" width="100" height="8" rx="4" fill="#FFE082" />
        <rect x="145" y="185" width="130" height="8" rx="4" fill="#FFE082" />
        <rect x="145" y="198" width="90" height="8" rx="4" fill="#FFE082" />
    </g>

    <!-- Phone/Device -->
    <g>
        <rect x="280" y="80" width="80" height="140" rx="10" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="2" />
        <!-- Screen content -->
        <rect x="290" y="100" width="60" height="8" rx="2" fill="#E0E0E0" />
        <rect x="290" y="115" width="45" height="8" rx="2" fill="#E0E0E0" />
        <rect x="290" y="135" width="55" height="8" rx="2" fill="#90CAF9" />
        <rect x="290" y="150" width="40" height="8" rx="2" fill="#90CAF9" />
        <rect x="290" y="170" width="50" height="6" rx="2" fill="#E0E0E0" />
        <rect x="290" y="182" width="35" height="6" rx="2" fill="#E0E0E0" />
        <!-- Phone camera -->
        <circle cx="320" cy="90" r="3" fill="#BDBDBD" />
    </g>

    <!-- Robot -->
    <g transform="translate(220, 150)">
        <!-- Body -->
        <rect x="0" y="50" width="80" height="90" rx="15" fill="#FFC107" />
        <!-- Head -->
        <rect x="10" y="0" width="60" height="50" rx="10" fill="#FFD54F" />
        <!-- Eyes -->
        <circle cx="30" cy="25" r="8" fill="#37474F" />
        <circle cx="50" cy="25" r="8" fill="#37474F" />
        <circle cx="32" cy="23" r="3" fill="white" />
        <circle cx="52" cy="23" r="3" fill="white" />
        <!-- Antenna -->
        <rect x="37" y="-15" width="6" height="20" fill="#78909C" />
        <circle cx="40" cy="-18" r="8" fill="#4CAF50" />
        <!-- Arms -->
        <rect x="-20" y="60" width="25" height="15" rx="7" fill="#FFC107" />
        <rect x="75" y="60" width="25" height="15" rx="7" fill="#FFC107" />
        <!-- Hand with phone -->
        <rect x="85" y="50" width="30" height="50" rx="5" fill="#FFD54F" />
        <rect x="90" y="55" width="20" height="35" rx="3" fill="#90CAF9" />
        <!-- Wheels -->
        <circle cx="20" cy="145" r="15" fill="#37474F" />
        <circle cx="60" cy="145" r="15" fill="#37474F" />
        <circle cx="20" cy="145" r="8" fill="#78909C" />
        <circle cx="60" cy="145" r="8" fill="#78909C" />
        <!-- Chest detail -->
        <rect x="25" y="70" width="30" height="25" rx="5" fill="#FFE082" />
        <rect x="30" y="75" width="20" height="6" rx="2" fill="#FFC107" />
        <rect x="30" y="84" width="15" height="6" rx="2" fill="#FFC107" />
    </g>
</svg>